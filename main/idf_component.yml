## IDF Component Manager Manifest File
dependencies:
  # Required by components/smooth_ui_toolkit_esp32. It used to arrive as a
  # transitive dependency of the waveshare BSP; declared here so the build no
  # longer relies on the BSP happening to pull it in.
  espressif/esp_lvgl_port: "^2"
  espressif/esp_wifi_remote: ^1.3.2
  espressif/esp_hosted: ^2.11.5
  espressif/ethernet_init: ^1.3.0
  cesanta/mongoose: ^7.8.2
  # The Waveshare 86-panel BSP is no longer pulled from the registry: it is
  # vendored in components/esp32_p4_wifi6_touch_lcd_4b (with its ST7703 driver
  # in components/esp_lcd_st7703), like esp32_p4_wifi6_touch_lcd_x is for the
  # touchlcd-7/8/10 boards. Upstream re-publishes under moving bounds and
  # dependencies.lock is git-ignored, so re-resolving used to change shipped
  # firmware with no commit behind it.

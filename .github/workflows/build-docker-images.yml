name: Build and push Docker images

on:
  push:
    branches: [ main ]
    paths:
      - 'boards/**/Dockerfile'
  workflow_dispatch:
    inputs:
      board:
        description: 'Board image to rebuild (or all)'
        required: true
        type: choice
        options:
          - all
          - waveshare-86-panel

env:
  REGISTRY: ghcr.io

jobs:
  matrix-setup:
    name: Setup image matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Build matrix from ci-boards.json
        id: set-matrix
        run: |
          SELECTED="${{ github.event.inputs.board || 'all' }}"
          if [[ "${SELECTED}" == "all" ]]; then
            MATRIX=$(jq -c '.' boards/ci-boards.json)
          else
            MATRIX=$(jq -c --arg b "${SELECTED}" '[.[] | select(.name == $b)]' boards/ci-boards.json)
          fi
          echo "matrix={\"include\":${MATRIX}}" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Build ${{ matrix.name }} image
    needs: matrix-setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix-setup.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/calaos-build-${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
